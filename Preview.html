<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TinyPal - WatchOS Simulation Preview</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        /* 45mm Apple Watch Bezel Mock */
        .watch-bezel {
            width: 320px;
            height: 390px;
            background: #121212;
            border-radius: 56px;
            border: 14px solid #1f1f1f;
            box-shadow:
                0 0 30px rgba(0, 0, 0, 0.8),
                inset 0 0 10px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .digital-crown {
            position: absolute;
            width: 14px;
            height: 54px;
            background: #2a2a2a;
            right: -14px;
            top: 105px;
            border-radius: 0 6px 6px 0;
            box-shadow: inset 2px 0 5px rgba(255, 255, 255, 0.08);
        }

        .side-button {
            position: absolute;
            width: 4px;
            height: 60px;
            background: #2a2a2a;
            right: -4px;
            top: 180px;
            border-radius: 0 4px 4px 0;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .floor-view {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20%;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.15));
            border-radius: 0 0 42px 42px;
            pointer-events: none;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 2x2 Selection Grid */
        .onboarding {
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
        }

        .pick-title {
            font-size: 13px;
            font-weight: 700;
            color: #ccc;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .pet-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            width: calc(100% - 16px);
            height: calc(100% - 40px);
            padding: 0 4px 4px 4px;
            box-sizing: border-box;
        }

        .pet-card {
            background: linear-gradient(135deg, #1e1e1e, #141414);
            border-radius: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
            overflow: hidden;
            position: relative;
            gap: 2px;
        }

        .pet-card:hover {
            background: linear-gradient(135deg, #262626, #1a1a1a);
        }

        .pet-card:active {
            transform: scale(0.92);
        }

        .pet-card svg {
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            margin-top: -12px;
        }

        .pet-card-name {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.88);
            letter-spacing: 0.4px;
            line-height: 1;
            position: absolute;
            bottom: 8px;
            flex-shrink: 0;
        }

        /* Glow ring flashes on selection */
        .pet-card.selected-flash {
            animation: card-select-flash 0.3s ease forwards;
        }

        @keyframes card-select-flash {
            0% {
                box-shadow: 0 0 0px 0px transparent;
            }

            40% {
                box-shadow: 0 0 16px 4px var(--card-accent);
            }

            100% {
                box-shadow: 0 0 0px 0px transparent;
            }
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            padding: 10px;
            box-sizing: border-box;
            position: absolute;
            z-index: 10;
        }

        .top-row {
            top: 10px;
        }

        .bottom-row {
            bottom: 10px;
        }

        .icon-btn {
            font-size: 26px;
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .character-container {
            width: 140px;
            height: 140px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-stack {
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 5;
        }

        .heart-icon {
            width: 20px;
            height: 20px;
            fill: rgba(255, 255, 255, 0.2);
            transition: fill 0.3s ease, filter 0.3s ease;
        }

        .heart-icon.filled {
            fill: #ff3b30;
            filter: drop-shadow(0 0 4px rgba(255, 59, 48, 0.6));
        }

        .pet-art {
            z-index: 1;
            position: relative;
        }

        .music-tile {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .music-tile:active {
            transform: scale(1.2);
        }

        /* SVG ANIMATIONS */
        .pet-art {
            transform-origin: bottom center;
        }

        /* Bramble Advanced Timings (Full Body) */
        .bramble-tummy-pat {
            animation: b-tummy-pat 2s ease-in-out forwards;
        }

        @keyframes b-tummy-pat {

            0%,
            100% {
                transform: scale(1);
            }

            25%,
            75% {
                transform: scale(1.1, 0.95);
            }

            50% {
                transform: scale(0.95, 1.05);
            }
        }

        .bramble-tummy-pat .bramble-arm-l {
            animation: b-pat-arm 2s ease-in-out forwards;
        }

        @keyframes b-pat-arm {

            0%,
            100% {
                transform: rotate(0);
            }

            30%,
            70% {
                transform: rotate(40deg) translate(10px, -5px);
            }
        }

        .bramble-peekaboo {
            animation: b-pb-body 2s ease-in-out forwards;
        }

        @keyframes b-pb-body {

            0%,
            100% {
                transform: scale(1);
            }

            20%,
            80% {
                transform: scale(1.05);
            }
        }

        .bramble-peekaboo .bramble-arm-l {
            animation: b-pb-arm-l 2s ease-in-out forwards;
        }

        @keyframes b-pb-arm-l {

            0%,
            100% {
                transform: rotate(0);
            }

            30%,
            70% {
                transform: rotate(140deg) translate(20px, -20px);
            }
        }

        .bramble-peekaboo .bramble-arm-r {
            animation: b-pb-arm-r 2s ease-in-out forwards;
        }

        @keyframes b-pb-arm-r {

            0%,
            100% {
                transform: rotate(0);
            }

            30%,
            70% {
                transform: rotate(-140deg) translate(-20px, -20px);
            }
        }

        .bramble-heavy-tumble {
            animation: b-heavy-t 2.2s ease-in-out forwards;
        }

        @keyframes b-heavy-t {
            0% {
                transform: rotate(0) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(1.2, 0.7) translateY(-10px);
            }

            100% {
                transform: rotate(360deg) scale(1) translateY(0);
            }
        }

        .bramble-happy-jive {
            animation: b-jive-body 2s ease-in-out forwards;
        }

        @keyframes b-jive-body {

            0%,
            100% {
                transform: rotate(0);
            }

            25%,
            75% {
                transform: rotate(10deg);
            }

            50% {
                transform: rotate(-10deg);
            }
        }

        .bramble-happy-jive .bramble-leg-l {
            animation: b-jive-leg 0.4s ease-in-out infinite alternate;
        }

        .bramble-happy-jive .bramble-leg-r {
            animation: b-jive-leg 0.4s ease-in-out infinite alternate-reverse;
        }

        /* Bramble: Bear Hug */
        .bramble-hug {
            animation: b-hug-body 1.2s ease-in-out forwards;
        }
        @keyframes b-hug-body {
            0%, 100% { transform: scale(1); }
            40% { transform: scale(1.08, 0.95); }
        }
        .bramble-hug .bramble-arm-l {
            animation: b-hug-arm-l 1.2s ease-in-out forwards;
        }
        @keyframes b-hug-arm-l {
            0%, 100% { transform: rotate(0); }
            40% { transform: rotate(150deg) translate(25px, -15px); }
        }
        .bramble-hug .bramble-arm-r {
            animation: b-hug-arm-r 1.2s ease-in-out forwards;
        }
        @keyframes b-hug-arm-r {
            0%, 100% { transform: rotate(0); }
            40% { transform: rotate(-150deg) translate(-25px, -15px); }
        }

        .bramble-ear-l { transform: translate(15px, 20px); transform-box: fill-box; transform-origin: center; }
        .bramble-ear-r { transform: translate(85px, 20px); transform-box: fill-box; transform-origin: center; }

        /* Bramble: Ear Wriggle (Stay Attached & Dramatic) */
        .bramble-ears {
            animation: b-ears-shake 0.8s ease-in-out forwards;
        }
        @keyframes b-ears-shake {
            0%, 100% { transform: rotate(0); }
            25%, 75% { transform: rotate(1.5deg); }
            50% { transform: rotate(-1.5deg); }
        }
        .bramble-ears .bramble-ear-l {
            animation: b-ear-w-l 0.8s ease-in-out forwards;
        }
        @keyframes b-ear-w-l {
            0%, 100% { transform: translate(15px, 20px) rotate(0) scale(1); }
            25%, 75% { transform: translate(15px, 20px) rotate(-18deg) scale(1.15, 0.85); }
            50% { transform: translate(15px, 20px) rotate(10deg) scale(0.85, 1.15); }
        }
        .bramble-ears .bramble-ear-r {
            animation: b-ear-w-r 0.8s ease-in-out forwards;
        }
        @keyframes b-ear-w-r {
            0%, 100% { transform: translate(85px, 20px) rotate(0) scale(1); }
            25%, 75% { transform: translate(85px, 20px) rotate(18deg) scale(1.15, 0.85); }
            50% { transform: translate(85px, 20px) rotate(-10deg) scale(0.85, 1.15); }
        }

        /* Bramble: Refined Belly Pat */
        .bramble-belly {
            animation: b-belly-jiggle 1.0s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
        }
        @keyframes b-belly-jiggle {
            0%, 100% { transform: scale(1, 1); }
            20% { transform: scale(1.2, 0.85); }
            40% { transform: scale(0.9, 1.1); }
            60% { transform: scale(1.1, 0.95); }
            80% { transform: scale(0.98, 1.02); }
        }

        /* Leap Variations */
        @keyframes anim-leap {
            0% {
                transform: scale(1, 1) translateY(0);
            }

            20% {
                transform: scale(1.3, 0.7) translateY(10px);
            }

            50% {
                transform: scale(0.8, 1.3) translateY(-40px);
            }

            80% {
                transform: scale(1.1, 0.9) translateY(0);
            }

            100% {
                transform: scale(1, 1) translateY(0);
            }
        }

        @keyframes anim-roll {
            0% {
                transform: rotate(0deg) scale(1);
            }

            50% {
                transform: rotate(180deg) scale(0.8);
            }

            100% {
                transform: rotate(360deg) scale(1);
            }
        }

        @keyframes anim-zoom {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-20px) scale(1.1);
            }

            75% {
                transform: translateX(20px) scale(1.1);
            }

            100% {
                transform: translateX(0) scale(1);
            }
        }

        @keyframes anim-peekaboo {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(0.1);
            }

            60% {
                transform: scale(0.1);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Idles */
        .bear-breathe {
            animation: bear-b 2.5s infinite alternate ease-in-out;
        }

        @keyframes bear-b {
            0% {
                transform: scaleY(0.98);
            }

            100% {
                transform: scaleY(1.05);
            }
        }

        .dino-shimmy {
            animation: dino-s 2.5s infinite alternate ease-in-out;
        }

        @keyframes dino-s {
            0% {
                transform: scaleY(0.98);
            }

            100% {
                transform: scaleY(1.02);
            }
        }

        /* Pip Walk Cycle & Head Bob */
        .pip-walk-l {
            animation: p-walk-cycle 0.8s infinite alternate ease-in-out;
            transform-origin: 30% 85%;
        }

        .pip-walk-r {
            animation: p-walk-cycle 0.8s infinite alternate-reverse ease-in-out;
            transform-origin: 60% 85%;
        }

        @keyframes p-walk-cycle {
            0% { transform: rotate(-3deg); }
            100% { transform: rotate(3deg); }
        }

        .pip-tail-wag .pet-art {
            animation: p-tail-w 1.8s ease-in-out forwards;
            transform-origin: 30% 90%;
        }

        @keyframes p-tail-w {

            0%,
            100% {
                transform: rotate(0);
            }

            30%,
            70% {
                transform: rotate(10deg);
            }

            50% {
                transform: rotate(-10deg);
            }
        }

        .pip-neck-nuzzle .pet-art {
            animation: p-neck-n 2.0s ease-in-out forwards;
            transform-origin: 50% 50%;
        }

        @keyframes p-neck-n {

            0%,
            100% {
                transform: rotate(0);
            }

            40% {
                transform: rotate(-5deg);
            }
        }

        .pip-dino-jump {
            animation: p-jump 2.0s ease-in-out forwards;
            transform-origin: bottom center;
        }

        @keyframes p-jump {

            0%,
            100% {
                transform: translateY(0) scale(1, 1);
            }

            20% {
                transform: translateY(5px) scale(1.3, 0.6);
            }

            50% {
                transform: translateY(-70px) scale(0.8, 1.4);
            }

            80% {
                transform: translateY(0) scale(1.2, 0.8);
            }
        }

        /* Pip: Spine Ripple (Fixed Stability) */
        .pip-spike-1, .pip-spike-2, .pip-spike-3, .pip-spike-4, .pip-spike-5, .pip-spike-6 {
            transform-box: fill-box;
            transform-origin: center;
        }
        .pip-spike-1 { transform: rotate(-10deg); }
        .pip-spike-2 { transform: rotate(-20deg); }
        .pip-spike-3 { transform: rotate(-35deg); }
        .pip-spike-4 { transform: rotate(-50deg); }
        .pip-spike-5 { transform: rotate(-65deg); }
        .pip-spike-6 { transform: rotate(-85deg); }

        .pip-ripple .pip-spike-1 { animation: p-spike-1-w 0.8s ease-in-out 0.0s forwards; }
        .pip-ripple .pip-spike-2 { animation: p-spike-2-w 0.8s ease-in-out 0.1s forwards; }
        .pip-ripple .pip-spike-3 { animation: p-spike-3-w 0.8s ease-in-out 0.2s forwards; }
        .pip-ripple .pip-spike-4 { animation: p-spike-4-w 0.8s ease-in-out 0.3s forwards; }
        .pip-ripple .pip-spike-5 { animation: p-spike-5-w 0.8s ease-in-out 0.4s forwards; }
        .pip-ripple .pip-spike-6 { animation: p-spike-6-w 0.8s ease-in-out 0.5s forwards; }

        @keyframes p-spike-1-w { 0%, 100% { transform: rotate(-10deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-5deg) scale(1.4); filter: brightness(1.3); } }
        @keyframes p-spike-2-w { 0%, 100% { transform: rotate(-20deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-15deg) scale(1.4); filter: brightness(1.3); } }
        @keyframes p-spike-3-w { 0%, 100% { transform: rotate(-35deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-30deg) scale(1.4); filter: brightness(1.3); } }
        @keyframes p-spike-4-w { 0%, 100% { transform: rotate(-50deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-45deg) scale(1.4); filter: brightness(1.3); } }
        @keyframes p-spike-5-w { 0%, 100% { transform: rotate(-65deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-60deg) scale(1.4); filter: brightness(1.3); } }
        @keyframes p-spike-6-w { 0%, 100% { transform: rotate(-85deg) scale(1); filter: brightness(1); } 50% { transform: rotate(-80deg) scale(1.4); filter: brightness(1.3); } }

        /* Pip: Stumpy Run */
        .pip-stumpy-run .pip-walk-l {
            animation: p-walk-cycle 0.15s infinite alternate ease-in-out;
        }
        .pip-stumpy-run .pip-walk-r {
            animation: p-walk-cycle 0.15s infinite alternate-reverse ease-in-out;
        }
        .pip-stumpy-run .pet-art {
            animation: p-run-shake 0.15s infinite alternate ease-in-out;
        }
        @keyframes p-run-shake {
            0% { transform: translateX(-2px); }
            100% { transform: translateX(2px); }
        }

        /* Pip: Dino Roar */
        .pip-roar {
            animation: p-roar-body 1.5s ease-in-out forwards;
        }
        @keyframes p-roar-body {
            0%, 100% { transform: scale(1) rotate(0); }
            20% { transform: scale(1.1, 0.9) rotate(-5deg); }
            50% { transform: scale(0.95, 1.15) rotate(-15deg); }
        }

        /* Tweek: Seed Peck */
        .tweek-seed-peck .tweek-body-group {
            animation: tw-peck-body 0.15s infinite alternate ease-in-out;
        }
        .tweek-seed-peck .tweek-beak-group {
            animation: tw-beak-snap 0.15s infinite alternate ease-in-out;
            transform-origin: 50px 55px;
        }
        @keyframes tw-peck-body {
            0% { transform: translateY(0) rotate(0); }
            100% { transform: translateY(12px) rotate(3deg); }
        }
        @keyframes tw-beak-snap {
            0% { transform: scaleY(1); }
            100% { transform: scaleY(0.5); }
        }

        /* Tweek: Wing Flutter */
        .tweek-wing-flutter .tweek-wing-l {
            animation: tw-flutter-l 0.1s infinite alternate ease-in-out;
        }
        .tweek-wing-flutter .tweek-wing-r {
            animation: tw-flutter-r 0.1s infinite alternate ease-in-out;
        }
        @keyframes tw-flutter-l {
            0% { transform: rotate(0); }
            100% { transform: rotate(30deg); }
        }
        @keyframes tw-flutter-r {
            0% { transform: rotate(0); }
            100% { transform: rotate(-30deg); }
        }

        /* Tweek: Happy Flip */
        .tweek-flip {
            animation: tw-flip-anim 1.2s cubic-bezier(0.45, 0, 0.55, 1) forwards;
            transform-origin: 50% 80%;
        }
        @keyframes tw-flip-anim {
            0% { transform: translateY(0) rotate(0) scale(1); }
            20% { transform: translateY(10px) scale(1.3, 0.7); }
            50% { transform: translateY(-80px) rotate(360deg) scale(0.8, 1.2); }
            80% { transform: translateY(0) rotate(360deg) scale(1.2, 0.8); }
            100% { transform: translateY(0) rotate(360deg) scale(1); }
        }

        .nova-melt {
            animation: nova-m 3s infinite alternate ease-in-out;
        }

        @keyframes nova-m {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.1, 0.95) translateY(5px); }
        }

        /* Nova: Bubble Blast (Random Directions) */
        .nova-bubble-blast .nova-b1 { animation: n-bubble-blast-1 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b2 { animation: n-bubble-blast-2 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b3 { animation: n-bubble-blast-3 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b4 { animation: n-bubble-blast-4 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b5 { animation: n-bubble-blast-5 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b6 { animation: n-bubble-blast-6 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b7 { animation: n-bubble-blast-7 1.2s ease-out forwards !important; }
        .nova-bubble-blast .nova-b8 { animation: n-bubble-blast-8 1.2s ease-out forwards !important; }

        @keyframes n-bubble-blast-1 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(-40px, -60px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-2 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(50px, -40px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-3 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(-60px, 30px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-4 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(45px, 55px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-5 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(0, -80px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-6 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(60px, 10px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-7 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(-30px, 70px) scale(0); opacity:0; } }
        @keyframes n-bubble-blast-8 { 0% { transform: translate(0,0) scale(1); opacity:0.4; } 100% { transform: translate(10px, -70px) scale(0); opacity:0; } }

        /* Nova: Glow Pulse */
        .nova-glow-pulse-fx .nova-pulse {
            animation: n-glow-p 1.5s ease-in-out forwards;
        }
        @keyframes n-glow-p {
            0%, 100% { transform: scale(1); filter: brightness(1) blur(8px); opacity: 0.3; }
            50% { transform: scale(1.4); filter: brightness(2) blur(12px); opacity: 0.8; }
        }

        /* Nova: Cosmic Squish */
        .nova-cosmic-squish {
            animation: n-squish 1.2s cubic-bezier(0.45, 0, 0.55, 1) forwards;
            transform-origin: center;
        }
        @keyframes n-squish {
            0%, 100% { transform: scale(1, 1); }
            30% { transform: scale(1.3, 0.7); }
            60% { transform: scale(0.8, 1.25); }
        }

        .nova-pulse {
            animation: n-pulse 1.5s infinite alternate ease-in-out;
            transform-origin: center;
        }

        @keyframes n-pulse {
            0% {
                transform: scale(0.95);
                opacity: 0.2;
            }

            100% {
                transform: scale(1.05);
                opacity: 0.5;
            }
        }

        .chick-jitter {
            animation: chick-j 0.1s infinite alternate;
        }

        @keyframes chick-j {
            0% {
                transform: translate(-2px, -2px);
            }

            100% {
                transform: translate(2px, 2px);
            }
        }

        /* Secondary Logic */
        .dino-wag {
            animation: d-wag 0.2s infinite alternate;
            transform-origin: left center;
        }

        @keyframes d-wag {
            0% {
                transform: rotate(10deg);
            }

            100% {
                transform: rotate(-10deg);
            }
        }

        .flap-l {
            animation: f-l 0.1s infinite alternate;
            transform-origin: top center;
        }

        @keyframes f-l {
            0% {
                transform: rotate(20deg);
            }

            100% {
                transform: rotate(60deg);
            }
        }

        .flap-r {
            animation: f-r 0.1s infinite alternate;
            transform-origin: top center;
        }

        @keyframes f-r {
            0% {
                transform: rotate(-20deg);
            }

            100% {
                transform: rotate(-60deg);
            }
        }

        /* Tweek Redesign Anims */
        .tweek-spin-dry {
            animation: t-spin 1.5s ease-in-out forwards;
        }

        @keyframes t-spin {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }

        .tweek-spin-dry .tweek-wing-l {
            animation: t-w-spin-l 1.5s linear forwards;
        }

        @keyframes t-w-spin-l {

            0%,
            100% {
                transform: rotate(0deg);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(45deg);
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(-45deg);
            }
        }

        .tweek-spin-dry .tweek-wing-r {
            animation: t-w-spin-r 1.5s linear forwards;
        }

        @keyframes t-w-spin-r {

            0%,
            100% {
                transform: rotate(0deg);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(-45deg);
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(45deg);
            }
        }

        .tweek-peck {
            animation: t-peck 0.6s ease-in-out forwards;
        }

        @keyframes t-peck {

            0%,
            100% {
                transform: rotate(0deg);
            }

            30%,
            70% {
                transform: rotate(30deg);
            }
        }

        .tweek-peck .tweek-beak-top,
        .tweek-chirp .tweek-beak-top {
            animation: b-top-open 0.6s ease-in-out forwards;
            transform-origin: 50px 55px;
        }

        @keyframes b-top-open {

            30%,
            70% {
                transform: translateY(-3px) scale(1.2);
            }
        }

        .tweek-peck .tweek-beak-bot,
        .tweek-chirp .tweek-beak-bot {
            animation: b-bot-open 0.6s ease-in-out forwards;
            transform-origin: 50px 55px;
        }

        @keyframes b-bot-open {

            30%,
            70% {
                transform: translateY(3px) scale(1.2);
            }
        }

        .tweek-flutter {
            animation: t-flutter 1.0s ease-out forwards;
        }

        @keyframes t-flutter {

            0%,
            100% {
                transform: translateY(0);
            }

            20%,
            80% {
                transform: translateY(-10px);
            }
        }

        .tweek-flutter .tweek-wing-l {
            animation: w-blur-l 1.0s linear forwards;
        }

        @keyframes w-blur-l {

            0%,
            100% {
                transform: rotate(0) scale(1);
                filter: blur(0px);
            }

            20%,
            80% {
                filter: blur(2px);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(45deg);
                filter: blur(2px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(-45deg);
                filter: blur(2px);
            }
        }

        .tweek-flutter .tweek-wing-r {
            animation: w-blur-r 1.0s linear forwards;
        }

        @keyframes w-blur-r {

            0%,
            100% {
                transform: rotate(0) scale(1);
                filter: blur(0px);
            }

            20%,
            80% {
                filter: blur(2px);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: rotate(-45deg);
                filter: blur(2px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: rotate(45deg);
                filter: blur(2px);
            }
        }

        .tweek-waddle {
            animation: t-waddle 1.2s ease-in-out forwards;
        }

        @keyframes t-waddle {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            12.5%,
            37.5%,
            62.5%,
            87.5% {
                transform: translate(15px, 0) rotate(10deg);
            }

            25%,
            50%,
            75% {
                transform: translate(-15px, 0) rotate(-10deg);
            }
        }

        .tweek-preen {
            animation: t-preen 1.5s ease-in-out forwards;
        }

        @keyframes t-preen {

            0%,
            100% {
                transform: rotate(0deg);
            }

            20%,
            80% {
                transform: rotate(-15deg);
            }
        }

        .tweek-preen .tweek-wing-l {
            animation: t-preen-wing 1.5s ease-in-out forwards;
        }

        @keyframes t-preen-wing {

            0%,
            100% {
                transform: rotate(0deg);
            }

            20%,
            80% {
                transform: rotate(-80deg);
            }

            30%,
            50%,
            70% {
                transform: rotate(-55deg);
            }

            40%,
            60% {
                transform: rotate(-80deg);
            }
        }

        .tweek-preen .eye-shape {
            animation: e-preen 1.5s forwards;
        }

        @keyframes e-preen {

            20%,
            80% {
                transform: scaleY(0.1);
            }
        }

        .tweek-startle {
            animation: t-startle 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes t-startle {

            0%,
            100% {
                transform: scale(1, 1) translateY(0);
            }

            10%,
            70% {
                transform: scale(0.8, 1.3) translateY(-20px);
            }
        }

        .tweek-startle .tweek-wing-l {
            animation: t-startle-wing-l 1.1s forwards;
        }

        @keyframes t-startle-wing-l {

            10%,
            70% {
                transform: rotate(-90deg);
            }
        }

        .tweek-startle .tweek-wing-r {
            animation: t-startle-wing-r 1.1s forwards;
        }

        @keyframes t-startle-wing-r {

            10%,
            70% {
                transform: rotate(90deg);
            }
        }

        .tweek-startle .tweek-beak-bot {
            animation: b-bot-open 1.1s forwards;
        }

        .tweek-startle .tweek-beak-top {
            animation: b-top-open 1.1s forwards;
        }

        .tweek-flip {
            animation: t-flip 1.3s ease-out forwards;
        }

        @keyframes t-flip {
            0% {
                transform: translateY(0) rotate(0deg) scale(1, 1);
            }

            35% {
                transform: translateY(-50px) rotate(-180deg) scale(1, 1);
            }

            70% {
                transform: translateY(0) rotate(-360deg) scale(1.3, 0.6);
            }

            100% {
                transform: translateY(0) rotate(-360deg) scale(1, 1);
            }
        }

        .tweek-idle-body {
            animation: t-idle-body 1.5s infinite alternate ease-in-out;
        }

        @keyframes t-idle-body {
            0% {
                transform: translateY(0) scale(1.0);
            }

            100% {
                transform: translateY(-3px) scale(1.02);
            }
        }

        .tweek-idle-wing-l {
            animation: t-idle-l 1.5s infinite alternate ease-in-out;
        }

        @keyframes t-idle-l {
            0% {
                transform: rotate(10deg);
            }

            100% {
                transform: rotate(25deg);
            }
        }

        .tweek-idle-wing-r {
            animation: t-idle-r 1.5s infinite alternate ease-in-out;
        }

        @keyframes t-idle-r {
            0% {
                transform: rotate(-10deg);
            }

            100% {
                transform: rotate(-25deg);
            }
        }

        .bubble-float {
            animation: b-float 2s infinite ease-in;
        }

        @keyframes b-float {
            0% {
                transform: translateY(0);
                opacity: 0.8;
            }

            100% {
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        .blink-anim .eye-shape {
            animation: e-blink 3s infinite;
            transform-origin: center;
        }

        @keyframes e-blink {

            0%,
            96%,
            100% {
                transform: scaleY(1);
            }

            98% {
                transform: scaleY(0);
            }
        }

        .food {
            position: absolute;
            font-size: 45px;
            top: -60px;
            opacity: 0;
            transition: top 0.5s ease-in, opacity 0.2s;
            z-index: 10;
            pointer-events: none;
        }

        /* (Legacy weather-window CSS removed) */

        .debug-dashboard {
            position: absolute;
            left: -220px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 16px;
            width: 160px;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .debug-dashboard h3 {
            margin-top: 0;
            color: #aaa;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .stat-row {
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
        }

        .stat-bar-bg {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            margin-top: 6px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s;
        }

        .hunger-fill {
            background: #28a745;
        }

        .happiness-fill {
            background: #fd7e14;
        }

        .energy-fill {
            background: #007bff;
        }

        .instructions {
            margin-top: 15px;
            font-size: 12px;
            color: #777;
            line-height: 1.5;
        }

        kbd {
            background: #444;
            color: #fff;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }

        @keyframes b-float-dynamic {
            0% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(10px);
            }
        }

        .confetti {
            position: absolute;
            transition: top 3s ease-out, transform 3s ease-out, opacity 3s ease-in;
        }
    </style>
</head>

<body>

    <div class="debug-dashboard">
        <h3>Sim State</h3>
        <div class="stat-row">Hearts: <span id="heartsDebug" style="font-weight: bold; color: #ff3b30;">4/4</span></div>
        <div class="stat-row">Happiness<div class="stat-bar-bg">
                <div id="happinessBar" class="stat-bar-fill happiness-fill"></div>
            </div>
        </div>
        <div class="stat-row">Energy<div class="stat-bar-bg">
                <div id="energyBar" class="stat-bar-fill energy-fill"></div>
            </div>
        </div>
        <div class="stat-row" style="margin-top: 20px; height: 30px;">
        </div>
        <div class="instructions">
            <strong>Binding Map:</strong><br>
            <kbd>Space</kbd> = Pet<br>
            <kbd>Enter</kbd> = Feed<br>
            <kbd>Tap</kbd> = Interaction<br>
            <kbd>L-Click</kbd> = Hold 3s to Reset
        </div>
    </div>

    <div class="watch-bezel">
        <div class="digital-crown"></div>
        <div class="side-button"></div>

        <!-- Legacy weatherWindow HTML removed -->
        <div class="floor-view hidden" id="floorView"></div>

        <!-- Onboarding Screen: 2x2 Selection Grid -->
        <div id="onboardingScreen" class="screen onboarding">
            <div class="pick-title">Pick a TinyPal</div>
            <div class="pet-grid" id="petGrid"></div>
        </div>

        <!-- Main Hub -->
        <div id="contentScreen" class="screen hidden">
            <div class="controls-row top-row">
                <button class="icon-btn" style="color:#28a745;" onclick="feedPet()">🍴</button>
                <span style="font-size:26px; font-weight:800; color:#fff; margin-top:-15px; cursor:pointer;"
                    id="dashboardName" onclick="resetToOnboarding()"></span>
                <button class="icon-btn" id="gameBtn" style="color:#007bff;" onclick="startGame()">🫧</button>
            </div>

            <div id="petContainer" class="character-container">
                <div id="heartStack" class="heart-stack"></div>
                <div id="food" class="food">🍎</div>
                <div id="petArt" class="pet-art pet-art-inner"></div>
            </div>

            <div class="controls-row bottom-row">
                <button class="icon-btn" style="color:#a55eea;" onclick="cycleColor()">✨</button>
                <div style="width:50px;"></div>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen hidden" style="background-color: black;">
            <button class="nav-btn"
                style="position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; font-size: 18px; background: rgba(255,255,255,0.7); color: black; border-radius: 50%; border: none; z-index: 20; display: flex; align-items: center; justify-content: center; line-height: 1; cursor: pointer;"
                onclick="closeGame()">←</button>

            <!-- Peek-a-boo Area -->
            <div id="peekabooArea" class="hidden"
                style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; justify-content:center; align-items:center; cursor:pointer;"
                onclick="peekReveal()">
                <div id="peekPetContainer" class="character-container">
                    <div id="peekPetArt" class="pet-art pet-art-inner"></div>
                </div>
            </div>

            <!-- Chirp-O-Matic Area -->
            <div id="chirpArea" class="hidden"
                style="position:absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                <div id="chirpPetContainer" class="character-container" style="margin-bottom: 20px;">
                    <div id="chirpPetArt" class="pet-art pet-art-inner"></div>
                </div>
                <div style="display:flex; gap:16px;">
                    <button class="music-tile" style="background:#ff4757; color:#ff4757;"
                        onclick="chirpTile(0, 'C')"></button>
                    <button class="music-tile" style="background:#1e90ff; color:#1e90ff;"
                        onclick="chirpTile(1, 'E')"></button>
                    <button class="music-tile" style="background:#ffa502; color:#ffa502;"
                        onclick="chirpTile(2, 'G')"></button>
                </div>
            </div>

            <div id="bubbleCanvas" style="position:absolute; top:0; left:0; width:100%; height:100%;"></div>
            <div id="gameWinState" class="hidden"
                style="width:100%; height:100%; position:absolute; top:0; left:0; display:flex; justify-content:center; align-items:center; z-index:10;">
                <div id="gamePetContainer" class="character-container"></div>
            </div>
        </div>
    </div>

    <script>
        let stats = { happiness: 100, energy: 100 };
        let isFeeding = false;
        let isSleeping = false;
        
        // Per-Pet lastFedTime storage
        function getPetFedKey(id) { return `tinypal_lastFed_${id}`; }
        
        function getHearts(id) {
            const petId = id || pets[petIndex].id;
            let lastFed = parseInt(localStorage.getItem(getPetFedKey(petId))) || Date.now();
            let hours = (Date.now() - lastFed) / (1000 * 60 * 60);
            return Math.max(1, 4 - Math.floor(hours / 4.0));
        }

        const pets = [
            { id: 'bramble', name: 'Bramble', tint: '#ffffff', palette: ["#D2B48C", "#A0522D", "#DEB887", "#CD853F", "#FFFACD", "#F5F5DC"] },
            { id: 'pip', name: 'Pip', tint: '#a8e6cf' },
            { id: 'nova', name: 'Nova', tint: '#dcedc1' },
            { id: 'tweek', name: 'Tweek', tint: '#ffd3b6' }
        ];
        let petIndex = 0;
        let chirpSuccessCount = 0;

        const tintCycle = ["#3498db", "#e91e63", "#e67e22", "#2ecc71", "#f1c40f", "#9b59b6"];
        let colorIndex = 0;
        let animHistory = {};

        // (carouselDisplay & carouselName removed — replaced by petGrid)
        const palElement = document.getElementById('petArt');
        const foodElement = document.getElementById('food');
        const floorView = document.getElementById('floorView');
        const dashboardName = document.getElementById('dashboardName');

        const heartsDebug = document.getElementById('heartsDebug');
        const happinessBar = document.getElementById('happinessBar');
        const energyBar = document.getElementById('energyBar');

        function getPetSVG(id, isStatic = false) {
            let shadow = `<ellipse cx="50" cy="105" rx="35" ry="8" fill="rgba(0,0,0,0.2)" />`;
            const blinkClass = isStatic ? "" : "blink-anim";
            const bearBreatheClass = isStatic ? "" : "bear-breathe";
            const petArtClass = isStatic ? "" : "pet-art";
            const shimmyClass = isStatic ? "" : "dino-shimmy";
            const tweekIdleBody = isStatic ? "" : "tweek-idle-body";
            const tweekIdleWingL = isStatic ? "" : "tweek-idle-wing-l";
            const tweekIdleWingR = isStatic ? "" : "tweek-idle-wing-r";
            
            const pipWalkL = isStatic ? "" : "pip-walk-l";
            const pipWalkR = isStatic ? "" : "pip-walk-r";
            const pipHeadBob = isStatic ? "" : "pip-head-bob";
            
            let face = `<g class="eyes ${blinkClass}">
                        <rect x="35" y="45" width="8" height="16" rx="4" fill="#000" class="eye-shape" />
                        <circle cx="40" cy="48" r="2" fill="#fff" />
                        <rect x="57" y="45" width="8" height="16" rx="4" fill="#000" class="eye-shape" />
                        <circle cx="62" cy="48" r="2" fill="#fff" />
                    </g>
                    <path d="M 43 65 Q 50 72 57 65" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" class="mouth-shape" />`;
            if (id === 'bramble') {
                const bGradId = `brambleGrad_${isStatic ? 'static' : 'main'}`;
                return `<svg viewBox="0 0 100 100" width="130" height="130" style="overflow:visible; color: inherit;">
                        <defs>
                            <linearGradient id="${bGradId}" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="currentColor"/><stop offset="100%" stop-color="currentColor"/>
                            </linearGradient>
                            <filter id="darken">
                                <feColorMatrix type="matrix" values="0.7 0 0 0 0  0 0.7 0 0 0  0 0 0.7 0 0  0 0 0 1 0" />
                            </filter>
                            <filter id="bearPlush">
                                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
                            </filter>
                        </defs>
                        ${shadow}
                        <g class="${petArtClass} ${bearBreatheClass}">
                            <!-- Ears (Back - Solid Brown) -->
                            <g class="bramble-ear-l">
                                <circle cx="0" cy="0" r="14" fill="#8B4513" filter="url(#darken)" />
                                <circle cx="0" cy="0" r="7" fill="#8B4513" />
                            </g>
                            <g class="bramble-ear-r">
                                <circle cx="0" cy="0" r="14" fill="#8B4513" filter="url(#darken)" />
                                <circle cx="0" cy="0" r="7" fill="#8B4513" />
                            </g>

                            <!-- Legs (Back/Bottom - Solid Brown) -->
                            <ellipse cx="32" cy="100" rx="18" ry="12" fill="#8B4513" filter="url(#darken)" class="bramble-leg-l" />
                            <ellipse cx="68" cy="100" rx="18" ry="12" fill="#8B4513" filter="url(#darken)" class="bramble-leg-r" />

                            <!-- Body (Themed Gradient) -->
                            <path d="M 50 35 C 70 35, 95 65, 95 90 C 95 105, 75 110, 50 110 C 25 110, 5 105, 5 90 C 5 65, 30 35, 50 35" fill="url(#${bGradId})" filter="url(#bearPlush)" />
                            
                            <!-- Head cluster (Themed Gradient) -->
                            <g transform="translate(0, -10)">
                                <rect x="15" y="0" width="70" height="65" rx="30" fill="url(#${bGradId})" filter="url(#bearPlush)" />

                                <!-- Muzzle Area -->
                                <ellipse cx="50" cy="48" rx="20" ry="14" fill="#F5DEB3" />
                                <path d="M 45 42 L 55 42 L 50 47 Z" fill="#000" />
                                
                                <!-- Face Overlay (Eyes Only) -->
                                <g class="eyes blink-anim">
                                    <g class="bramble-eye-l">
                                        <circle cx="35" cy="25" r="7" fill="#000" class="eye-shape" />
                                        <circle cx="38" cy="22" r="2.5" fill="#fff" />
                                    </g>
                                    <g class="bramble-eye-r">
                                        <circle cx="65" cy="25" r="7" fill="#000" class="eye-shape" />
                                        <circle cx="68" cy="22" r="2.5" fill="#fff" />
                                    </g>
                                </g>
                            </g>

                            <!-- Arms (Front - Solid Brown) -->
                            <rect x="18" y="60" width="12" height="28" rx="6" fill="#8B4513" filter="url(#darken)" class="bramble-arm-l" />
                            <rect x="70" y="60" width="12" height="28" rx="6" fill="#8B4513" filter="url(#darken)" class="bramble-arm-r" />
                        </g>
                    </svg>`;
            } else if (id === 'pip') {
                const gradId = `pipGrad_${isStatic ? 'static' : 'main'}`;
                return `<svg viewBox="0 0 100 100" width="130" height="130" style="overflow:visible; color: inherit;">
                        <defs>
                            <linearGradient id="${gradId}" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="currentColor"/><stop offset="100%" stop-color="currentColor" />
                            </linearGradient>
                            <filter id="pipShadow">
                                <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-opacity="0.5"/>
                            </filter>
                        </defs>
                        ${shadow}
