        // Build the 2x2 grid once on load
        function buildSelectionGrid() {
            const grid = document.getElementById('petGrid');
            grid.innerHTML = '';
            const accentColors = [
                '#D2B48C', // Bramble – sand
                '#20B2AA', // Pip    – teal
                '#00ffff', // Nova   – cyan
                '#FFD700'  // Tweek  – gold
            ];
            pets.forEach((pet, index) => {
                const card = document.createElement('div');
                card.className = 'pet-card';
                card.style.setProperty('--card-accent', accentColors[index]);
                card.style.borderColor = accentColors[index] + '44';
                card.innerHTML = `
                    <div style="color:${accentColors[index]}; display:flex; align-items:center; justify-content:center;">
                        ${getPetSVG(pet.id, true)}
                    </div>
                    <div class="pet-card-name" style="color:${accentColors[index]};">${pet.name}</div>
                `;
                card.addEventListener('click', () => selectPet(index, card, accentColors[index]));
                grid.appendChild(card);
            });
        }

        function selectPet(index, cardEl, accent) {
            petIndex = index;
            // Flash animation
            cardEl.classList.add('selected-flash');
            setTimeout(() => {
                // Transition to main room
                document.getElementById('onboardingScreen').classList.add('hidden');
                document.getElementById('contentScreen').classList.remove('hidden');
                floorView.classList.remove('hidden');
                dashboardName.innerText = pets[petIndex].name;
                updateColorRendering();
                synchronizeUI();
            }, 260);
        }



        // (arrow nav & confirmPet replaced by selectPet + buildSelectionGrid above)

        function cycleColor() {
            const palette = pets[petIndex].palette || tintCycle;
            colorIndex = (colorIndex + 1) % palette.length;
            updateColorRendering();
        }

        function updateColorRendering() {
            const palette = pets[petIndex].palette || tintCycle;
            const currentColor = palette[colorIndex % palette.length];
            
            const palArt = document.getElementById('petArt');
            if (palArt) {
                palArt.innerHTML = getPetSVG(pets[petIndex].id);
                palArt.style.color = currentColor;
            }

            const chirpBox = document.getElementById('chirpPetArt');
            if (chirpBox) {
                chirpBox.innerHTML = getPetSVG(pets[petIndex].id);
                chirpBox.style.color = currentColor;
            }
        }

        function setFacialExpression(state) {
            const mouths = document.querySelectorAll('.mouth-shape');
            const eyes = document.querySelectorAll('.eye-shape');
            if (pets[petIndex].id === 'tweek') return; // Custom beak, bypass

            if (state === 'sad') {
                mouths.forEach(m => m.setAttribute('d', 'M 43 68 Q 50 63 57 68'));
            } else if (state === 'eating') {
                mouths.forEach(m => m.setAttribute('d', 'M 45 65 A 5 5 0 1 0 55 65 A 5 5 0 1 0 45 65'));
            } else {
                mouths.forEach(m => m.setAttribute('d', 'M 43 65 Q 50 72 57 65')); // Happy
            }
        }

        function synchronizeUI() {
            let currentHearts = getHearts();
            if (heartsDebug) heartsDebug.innerText = currentHearts + '/4';
            if (happinessBar) happinessBar.style.width = stats.happiness + '%';
            if (energyBar) energyBar.style.width = stats.energy + '%';

            const gameBtn = document.getElementById('gameBtn');
            if (pets[petIndex].id === 'bramble') {
                gameBtn.innerHTML = '👀';
                gameBtn.style.color = '#ff9800';
            } else if (pets[petIndex].id === 'tweek') {
                gameBtn.innerHTML = '🎵';
                gameBtn.style.color = '#a55eea';
            } else {
                gameBtn.innerHTML = '🫧';
                gameBtn.style.color = '#007bff';
            }

            let stackHtml = '';
            for (let i = 0; i < 4; i++) {
                // To deplete from top-down, we fill from the bottom up.
                // Index 0 is the top of the vertical stack.
                let isFilled = i >= (4 - currentHearts);
                let heartClass = isFilled ? 'heart-icon filled' : 'heart-icon';
                stackHtml += `<svg class="${heartClass}" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
            }
            const heartStack = document.getElementById('heartStack');
            if (heartStack) heartStack.innerHTML = stackHtml;

            if (currentHearts === 1) {
                setFacialExpression('sad');
                isSleeping = true;
                palElement.style.filter = 'grayscale(1)';
                palElement.style.opacity = 0.7;
            } else {
                if (!isFeeding) setFacialExpression('happy');
                isSleeping = false;
                palElement.style.filter = 'none';
                palElement.style.opacity = 1;
            }
        }

        function feedPet() {
            if (isFeeding || getHearts() === 4) return;
            isFeeding = true;

            foodElement.style.transition = 'none';
            foodElement.style.top = '-60px';
            foodElement.style.opacity = '1';

            setTimeout(() => {
                foodElement.style.transition = 'top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s';
                foodElement.style.top = '-10px';

                setTimeout(() => {
                    // Capture hearts BEFORE replenishing
                    const initialHearts = getHearts();
                    
                    // Replenish hearts
                    const petId = pets[petIndex].id;
                    let lastFed = Date.now(); 
                    localStorage.setItem(getPetFedKey(petId), lastFed);
                    stats.happiness = 100;

                    foodElement.style.opacity = '0';
                    foodElement.style.top = '-60px';
                    setFacialExpression('eating');

                    setTimeout(() => {
                        synchronizeUI();
                        if (initialHearts === 1) {
                            setFacialExpression('happy');
                            const svg = palElement.querySelector('svg');
                            if (svg) {
                                svg.style.animation = 'none';
                                void svg.offsetWidth;
                                svg.style.animation = 'anim-leap 0.45s cubic-bezier(0.25, 0.8, 0.25, 1) 4 alternate';
                                setTimeout(() => { svg.style.animation = ''; }, 2000);
                            }
                        } else {
                            setFacialExpression('happy');
                            triggerRandomAnim();
                        }
                    }, 600);
                }, 500);
            }, 50);

            // Ensure feeding lock always releases
            setTimeout(() => { isFeeding = false; }, 2000);
        }

        let isWebAnimating = false;

        function releaseBrambleAnim(container, choice, extraCleanup) {
            container.classList.remove(choice);
            container.classList.add('bear-breathe');
            if (extraCleanup) extraCleanup();
            isWebAnimating = false;
        }

        function triggerRandomAnim() {
            if (isWebAnimating) return;
            let container = document.getElementById('petArt');
            if (!container) return;

            isWebAnimating = true;

            const petId = pets[petIndex].id;
            if (!animHistory[petId]) animHistory[petId] = [];

            if (petId === 'bramble') {
                let anims = ['bramble-tummy-pat', 'bramble-peekaboo', 'bramble-heavy-tumble', 'bramble-happy-jive', 'bramble-hug', 'bramble-ears', 'bramble-belly'];
                
                // Filter out recently used animations (last 3)
                const available = anims.filter(a => !animHistory[petId].includes(a));
                // Fallback to full list if everything is filtered (shouldn't happen with 3 vs 7)
                const pool = available.length > 0 ? available : anims;
                let choice = pool[Math.floor(Math.random() * pool.length)];

                // Update history
                animHistory[petId].push(choice);
                if (animHistory[petId].length > 3) animHistory[petId].shift();

                // Clear all interaction classes and remove idle, then force reflow
                anims.forEach(a => container.classList.remove(a));
                container.classList.remove('bear-breathe');
                void container.offsetWidth;

                container.classList.add(choice);
                console.log("[Bramble] Triggering: " + choice);

                let dur = 2000;
                if (choice === 'bramble-heavy-tumble') dur = 2200;
                if (choice === 'bramble-hug') dur = 1200;
                if (choice === 'bramble-ears') dur = 800;
                if (choice === 'bramble-belly') dur = 1000;

                if (choice === 'bramble-ears') setFacialExpression('wink');
                else setFacialExpression('happy');

                if (choice === 'bramble-peekaboo') {
                    const eyes = container.querySelectorAll('.eye-shape');
                    setTimeout(() => { eyes.forEach(e => e.style.transform = 'scaleY(0.1)'); }, 300);
                    setTimeout(() => { eyes.forEach(e => e.style.transform = 'scaleY(1)'); }, 1400);
                }

                setTimeout(() => {
                    releaseBrambleAnim(container, choice, () => {
                        setFacialExpression('happy');
                    });
                }, dur);
            } else if (petId === 'pip') {
                let anims = ['pip-tail-wag', 'pip-neck-nuzzle', 'pip-dino-jump', 'pip-ripple', 'pip-stumpy-run', 'pip-roar'];
                
                const available = anims.filter(a => !animHistory[petId].includes(a));
                const pool = available.length > 0 ? available : anims;
                let choice = pool[Math.floor(Math.random() * pool.length)];

                animHistory[petId].push(choice);
                if (animHistory[petId].length > 3) animHistory[petId].shift();

                setFacialExpression('happy');
                container.classList.add(choice);
                console.log("[Pip] Triggering: " + choice);

                let dur = 2000;
                if (choice === 'pip-roar') dur = 1500;
                if (choice === 'pip-ripple') dur = 1500;
                if (choice === 'pip-stumpy-run') dur = 1500;

                setTimeout(() => {
                    container.classList.remove(choice);
                    isWebAnimating = false;
                }, dur);
            } else if (pets[petIndex].id === 'tweek') {
                const anims = ['tweek-spin-dry', 'tweek-peck', 'tweek-flutter', 'tweek-waddle', 'tweek-preen', 'tweek-startle', 'tweek-flip', 'tweek-seed-peck', 'tweek-wing-flutter', 'tweek-happy-flip'];
                
                const available = anims.filter(a => !animHistory[petId].includes(a));
                const pool = available.length > 0 ? available : anims;
                let choice = pool[Math.floor(Math.random() * pool.length)];

                animHistory[petId].push(choice);
                if (animHistory[petId].length > 3) animHistory[petId].shift();

                // Remove idle classes
                const wingsL = container.querySelectorAll('.tweek-idle-wing-l');
                const wingsR = container.querySelectorAll('.tweek-idle-wing-r');
                const bodyGroup = container.querySelector('.tweek-body-group');

                if (bodyGroup) bodyGroup.classList.remove('tweek-idle-body');
                container.classList.remove('tweek-idle-body', 'chick-jitter');
                wingsL.forEach(w => w.classList.remove('tweek-idle-wing-l'));
                wingsR.forEach(w => w.classList.remove('tweek-idle-wing-r'));

                void container.offsetWidth; // Trigger reflow
                container.classList.add(choice);
                console.log("[Tweek] Triggering: " + choice);

                let dur = 1800;
                if (choice === 'tweek-spin-dry' || choice === 'tweek-preen' || choice === 'tweek-seed-peck') dur = 1500;
                else if (choice === 'tweek-waddle') dur = 1200;
                else if (choice === 'tweek-startle') dur = 1100;
                else if (choice === 'tweek-flip' || choice === 'tweek-happy-flip') dur = 1200;
                else if (choice === 'tweek-flutter' || choice === 'tweek-wing-flutter') dur = 1000;
                else dur = 600;

                setTimeout(() => {
                    container.classList.remove(choice);
                    if (bodyGroup) bodyGroup.classList.add('tweek-idle-body');
                    wingsL.forEach(w => w.classList.add('tweek-idle-wing-l'));
                    wingsR.forEach(w => w.classList.add('tweek-idle-wing-r'));
                    isWebAnimating = false;
                }, dur);

            } else if (petId === 'nova') {
                let anims = ['nova-bubble-blast', 'nova-glow-pulse-fx', 'nova-cosmic-squish'];
                
                const available = anims.filter(a => !animHistory[petId].includes(a));
                const pool = available.length > 0 ? available : anims;
                let choice = pool[Math.floor(Math.random() * pool.length)];

                animHistory[petId].push(choice);
                if (animHistory[petId].length > 2) animHistory[petId].shift(); // Nova only has 3, so keep 2 in history

                container.classList.add(choice);
                console.log("[Nova] Triggering: " + choice);

                let dur = 1200;
                if (choice === 'nova-glow-pulse-fx') dur = 1500;

                setTimeout(() => {
                    container.classList.remove(choice);
                    isWebAnimating = false;
                }, dur);
            } else {
                const anims = [
                    'anim-leap 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) forwards',
                    'anim-roll 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
                    'anim-zoom 0.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards',
                    'anim-peekaboo 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards'
                ];
                let choice = anims[Math.floor(Math.random() * anims.length)];
                let svg = container.querySelector('svg') || container;
                svg.style.animation = choice;
                setTimeout(() => {
                    svg.style.animation = '';
                    isWebAnimating = false;
                }, 800);
            }
        }

        function petPal() {
            if (isSleeping || isWebAnimating) return;
            triggerRandomAnim();
            stats.happiness = Math.min(100, stats.happiness + 20);
            synchronizeUI();
        }

        let loopInterval;
        function startStatsDecay() {
            if (loopInterval) clearInterval(loopInterval);
            loopInterval = setInterval(() => {
                stats.happiness = Math.max(0, stats.happiness - 1);
                stats.energy = Math.max(0, stats.energy - 0.5);

                // Heart Decay logic: 15s active, 4h background
                // We only accelerate the ACTIVE pet's decay when visible.
                if (!document.hidden) {
                    const activePetId = pets[petIndex].id;
                    const key = getPetFedKey(activePetId);
                    let lastFed = parseInt(localStorage.getItem(key)) || Date.now();
                    
                    // Reduce lastFed faster (1 heart every 15s)
                    const decayAmount = (4 * 60 * 60 * 1000) / 15;
                    lastFed -= Math.floor(decayAmount / 1); 
                    localStorage.setItem(key, lastFed);
                }

                synchronizeUI();
            }, 1000);
        }

        document.addEventListener('visibilitychange', () => {
            // When returning to the app, we don't jump—we just resume the faster decay
            console.log("[System] Visibility changed: " + document.visibilityState);
        });

        let pressTimer;
        let clickStart;
        const petContainer = document.getElementById('petContainer');

        if (petContainer) {
            petContainer.addEventListener('pointerdown', () => {
                clickStart = Date.now();
                pressTimer = setTimeout(() => {
                    resetToOnboarding();
                }, 1000);
            });

            petContainer.addEventListener('pointerup', () => {
                clearTimeout(pressTimer);
                let duration = Date.now() - clickStart;
                if (duration < 300) { petPal(); }
            });
            petContainer.addEventListener('pointerleave', () => clearTimeout(pressTimer));
        }

        document.addEventListener('keydown', (e) => {
            if (['Space', 'Enter'].includes(e.code)) e.preventDefault();
            if (!document.getElementById('onboardingScreen').classList.contains('hidden')) return;

            if (e.code === 'Space') { petPal(); }
            if (e.code === 'Enter') { feedPet(); }
        });

        function resetToOnboarding() {
            document.getElementById('contentScreen').classList.add('hidden');
            floorView.classList.add('hidden');
            document.getElementById('onboardingScreen').classList.remove('hidden');
            stats = { happiness: 100, energy: 100 };
            lastFedTime = Date.now();
            localStorage.setItem('tinypal_lastFed', lastFedTime);
            synchronizeUI();
        }

        // --- PopView Mini-Game Logic ---
        function startGame() {
            document.getElementById('contentScreen').classList.add('hidden');
            floorView.classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            const isBramble = pets[petIndex].id === 'bramble';
            const isTweek = pets[petIndex].id === 'tweek';
            const canvas = document.getElementById('bubbleCanvas');
            const peekArea = document.getElementById('peekabooArea');
            const chirpArea = document.getElementById('chirpArea');
            const gameWinState = document.getElementById('gameWinState');

            canvas.innerHTML = '';
            gameWinState.classList.add('hidden');

            if (isBramble) {
                canvas.classList.add('hidden');
                peekArea.classList.remove('hidden');
                chirpArea.classList.add('hidden');
                startPeekaboo();
            } else if (isTweek) {
                canvas.classList.add('hidden');
                peekArea.classList.add('hidden');
                chirpArea.classList.remove('hidden');
                startChirpGame();
            } else {
                canvas.classList.remove('hidden');
                peekArea.classList.add('hidden');
                chirpArea.classList.add('hidden');
                startBubbles();
            }
        }

        function startChirpGame() {
            const container = document.getElementById('chirpPetArt');
            if (container) {
                container.innerHTML = getPetSVG('tweek');
            }
            const chirpPetContainer = document.getElementById('chirpPetContainer');
            chirpPetContainer.style.transform = 'translateX(0)';
            chirpSuccessCount = 0;

            // Force Tweek to a game color (Red or Yellow)
            // We avoid index 0 (Blue) because he starts standing on the middle (Blue) tile.
            const startIndices = [1, 4]; // Match tintCycle: Red, Yellow
            colorIndex = startIndices[Math.floor(Math.random() * startIndices.length)];
            updateColorRendering();
        }

        function chirpTile(idx, note) {
            const container = document.getElementById('chirpPetContainer');
            const offsets = [-50, 0, 50];

            const gameColors = ["#e91e63", "#3498db", "#f1c40f"]; // Red, Blue, Yellow
            const targetHex = gameColors[idx];
            const currentHex = tintCycle[colorIndex];
            const isMatch = currentHex === targetHex;

            // Hop Animation (Always moves)
            container.style.transform = `translateX(${offsets[idx]}px) translateY(-30px)`;
            setTimeout(() => {
                container.style.transform = `translateX(${offsets[idx]}px) translateY(0px)`;
            }, 250);

            if (isMatch) {
                // Beak animation (Success Only)
                const beakTop = container.querySelector('.tweek-beak-top');
                const beakBot = container.querySelector('.tweek-beak-bot');

                if (beakTop && beakBot) {
                    beakTop.style.transition = 'transform 0.1s';
                    beakBot.style.transition = 'transform 0.1s';
                    beakTop.style.transform = 'translateY(-3px) scale(1.2)';
                    beakBot.style.transform = 'translateY(3px) scale(1.2)';

                    setTimeout(() => {
                        beakTop.style.transform = '';
                        beakBot.style.transform = '';
                    }, 300);
                }

                // Color Cycle (Success Only) - Pick a DIFFERENT game color
                const gameIndices = [0, 1, 4];
                const available = gameIndices.filter(i => i !== colorIndex);
                colorIndex = available[Math.floor(Math.random() * available.length)];

                chirpSuccessCount++;
                if (chirpSuccessCount >= 5) {
                    setTimeout(() => { triggerWinCelebration(); }, 500);
                    return;
                }

                setTimeout(() => {
                    updateColorRendering();
                }, 350);

                console.log("[SFX] CHIRP " + note);
                stats.happiness = Math.min(100, stats.happiness + 5);
                synchronizeUI();
            } else {
                console.log("[SFX] CLICK (Mismatch)");
            }

            // Tile pulse
            const tiles = document.querySelectorAll('.music-tile');
            tiles[idx].style.boxShadow = `0 0 20px ${tiles[idx].style.backgroundColor}`;
            setTimeout(() => { tiles[idx].style.boxShadow = 'none'; }, 400);

            // Inactivity return
            if (this.chirpTimer) clearTimeout(this.chirpTimer);
            this.chirpTimer = setTimeout(() => {
                container.style.transform = 'translateX(0)';
            }, 2000);
        }

        let peekState = 'hiding';
        function startPeekaboo() {
            peekState = 'hiding';
            const container = document.getElementById('peekPetArt');
            if (container) {
                container.innerHTML = getPetSVG('bramble');
            }
            const art = document.querySelector('#peekPetArt .pet-art');
            const eyes = document.querySelectorAll('#peekPetArt .eye-shape');
            const armsL = document.querySelector('#peekPetArt .bramble-arm-l');
            const armsR = document.querySelector('#peekPetArt .bramble-arm-r');

            // Set Initial Hide State
            armsL.style.transform = 'rotate(160deg) translate(20px, -20px)';
            armsR.style.transform = 'rotate(-160deg) translate(-20px, -20px)';
            eyes.forEach(e => e.style.transform = 'scaleY(0.1)');
            art.style.transform = 'scale(0.8)';

            // Loop muffled giggle (simulated)
            this.peekInterval = setInterval(() => {
                if (peekState === 'hiding') console.log("[SFX] Muffled Giggle");
            }, 4000);
        }

        function peekReveal() {
            if (peekState !== 'hiding') return;
            peekState = 'revealed';

            const container = document.getElementById('peekPetContainer');
            const art = container.querySelector('.pet-art');
            const eyes = container.querySelectorAll('.eye-shape');
            const armsL = container.querySelector('.bramble-arm-l');
            const armsR = container.querySelector('.bramble-arm-r');

            // Snap Open
            armsL.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            armsR.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            armsL.style.transform = 'rotate(-20deg)';
            armsR.style.transform = 'rotate(20deg)';

            eyes.forEach(e => {
                e.style.transition = 'transform 0.1s';
                e.style.transform = 'scaleY(1.2) scaleX(1.1)';
            });

            art.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            art.style.transform = 'scale(1.0)';

            console.log("[SFX] PEEK-A-BOO!");
            stats.happiness = Math.min(100, stats.happiness + 15);
            synchronizeUI();

            // Auto Reset after 3s
            setTimeout(() => {
                peekState = 'hiding';
                const container = document.getElementById('peekPetArt');
                const art = container.querySelector('.pet-art-inner');
                const eyes = container.querySelectorAll('.eye-shape');
                const armsL = container.querySelector('.bramble-arm-l');
                const armsR = container.querySelector('.bramble-arm-r');

                armsL.style.transition = 'transform 1s ease-in-out';
                armsR.style.transition = 'transform 1s ease-in-out';
                armsL.style.transform = 'rotate(160deg) translate(20px, -20px)';
                armsR.style.transform = 'rotate(-160deg) translate(-20px, -20px)';
                eyes.forEach(e => e.style.transform = 'scaleY(0.1)');
                art.style.transform = 'scale(0.8)';
            }, 3000);
        }

        function startBubbles() {
            const canvas = document.getElementById('bubbleCanvas');
            canvas.innerHTML = '';
            document.getElementById('gameWinState').classList.add('hidden');
            const gamePetContainer = document.getElementById('gamePetContainer');
            gamePetContainer.classList.add('hidden');
            gamePetContainer.innerHTML = '';

            const colors = ['#ff6b6b', '#4ecdc4', '#ffe66d', '#ff9a9e', '#a8e6cf'];
            for (let i = 0; i < 5; i++) {
                let bubble = document.createElement('div');
                bubble.style.position = 'absolute';
                bubble.style.width = '50px';
                bubble.style.height = '50px';
                bubble.style.borderRadius = '50%';
                bubble.style.background = `radial-gradient(circle, ${colors[i % colors.length]}cc 0%, ${colors[i % colors.length]}66 70%, transparent 100%)`;

                let x = Math.random() * 210 + 30; // 320 max width
                let y = Math.random() * 280 + 30; // 390 max height
                bubble.style.left = x + 'px';
                bubble.style.top = y + 'px';

                let delay = Math.random() * 2;
                let dur = Math.random() * 1 + 1.5;
                bubble.style.animation = `b-float-dynamic ${dur}s infinite alternate ease-in-out ${delay}s`;
                bubble.style.transition = 'transform 0.1s ease-out, opacity 0.1s ease-out';

                bubble.onclick = function () {
                    if (this.popped) return;
                    this.popped = true;
                    this.style.transform = 'scale(1.5)';
                    this.style.opacity = '0';

                    stats.happiness = Math.min(100, stats.happiness + 20);
                    synchronizeUI();

                    checkWinCondition();
                };

                canvas.appendChild(bubble);
            }
        }

        function checkWinCondition() {
            const bubbles = document.querySelectorAll('#bubbleCanvas div');
            let allPopped = true;
            bubbles.forEach(b => { if (!b.popped) allPopped = false; });

            if (allPopped) {
                triggerWinCelebration();
            }
        }

        function triggerWinCelebration() {
            const gameWinState = document.getElementById('gameWinState');
            const gamePetContainer = document.getElementById('gamePetContainer');
            const canvas = document.getElementById('bubbleCanvas');
            const petId = pets[petIndex].id;

            gameWinState.classList.remove('hidden');
            canvas.innerHTML = ''; // Clear bubbles

            let activeContainer;
            if (petId === 'tweek') {
                activeContainer = document.getElementById('chirpPetContainer');
                gamePetContainer.classList.add('hidden');
            } else if (petId === 'bramble') {
                activeContainer = document.getElementById('peekPetContainer');
                gamePetContainer.classList.add('hidden');
            } else {
                activeContainer = gamePetContainer;
                gamePetContainer.classList.remove('hidden');
                gamePetContainer.innerHTML = getPetSVG(petId, true);
                const palette = pets[petIndex].palette || tintCycle;
                gamePetContainer.style.color = palette[colorIndex % palette.length];
                gamePetContainer.style.transform = 'scale(1.1) translateY(20px)';
            }

            let svg = activeContainer.querySelector('svg');
            if (svg) {
                if (petId === 'bramble') {
                    svg.style.animation = 'anim-roll 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite';
                } else {
                    svg.style.animation = 'anim-leap 0.6s cubic-bezier(0.25, 0.8, 0.25, 1) infinite alternate';
                }
            }

            for (let i = 0; i < 40; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = (Math.random() * 4 + 4) + 'px';
                conf.style.height = (Math.random() * 6 + 6) + 'px';
                const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = (Math.random() * 320) + 'px';
                conf.style.top = '-20px';

                let delay = Math.random() * 1.5;
                let duration = Math.random() * 2 + 2;
                conf.style.transition = `top ${duration}s linear ${delay}s, transform ${duration}s linear ${delay}s, opacity ${duration * 0.3}s ease-in ${delay + duration * 0.7}s`;

                gameWinState.appendChild(conf);

                setTimeout(() => {
                    conf.style.top = '450px';
                    conf.style.transform = `rotate(${Math.random() * 720}deg)`;
                    conf.style.opacity = '0';
                }, 50);
            }

            setTimeout(() => {
                closeGame();
            }, 3000);
        }

        function closeGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('contentScreen').classList.remove('hidden');
            document.getElementById('floorView').classList.remove('hidden');
            synchronizeUI();
        }

        function init() {
            buildSelectionGrid();
            startStatsDecay();
            synchronizeUI();
            // Kick off first weather update
            updateWeather();
        }

        init();
    </script>
</body>

</html>
